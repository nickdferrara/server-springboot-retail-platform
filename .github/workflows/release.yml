name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          docker build -f docker/Dockerfile -t "${image}:${GITHUB_SHA}" -t "${image}:latest" .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${GITHUB_SHA}" | cut -d@ -f2)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Deploys to Azure only once the repository variable AZURE_DEPLOY_ENABLED is set to "true".
  # Until then nothing is created in Azure and nothing is billed. See infra/README.md.
  deploy-dev:
    name: deploy to dev
    needs: image
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and application
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/dev.bicepparam \
            --parameters image="${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}" \
            --parameters entraTenantId="${{ vars.AZURE_TENANT_ID }}" \
            --parameters entraApiAudience="${{ vars.ENTRA_API_AUDIENCE }}"
