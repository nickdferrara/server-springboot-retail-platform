name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (Detekt, ktlint)
        run: ./gradlew detekt ktlintCheck

      - name: Tests and Modulith verification
        run: ./gradlew test

      - name: Coverage gate (Kover)
        run: ./gradlew koverVerify koverXmlReport koverHtmlReport

      - name: Build
        run: ./gradlew build

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -f docker/Dockerfile -t retail-platform:ci .

      - name: Image runs as a non-root user
        run: test "$(docker inspect --format '{{.Config.User}}' retail-platform:ci)" = "10001:10001"

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Compile Bicep templates
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/dev.bicepparam --stdout > /dev/null
