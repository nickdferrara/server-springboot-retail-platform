# Developer workstation. Everything runs on the local machine; no Azure service is contacted.
server:
  port: 8080

spring:
  # Matches docker/docker-compose.yml. These are throwaway credentials for a database on the developer's machine.
  datasource:
    url: jdbc:postgresql://localhost:5432/retail
    username: retail
    password: retail
  docker:
    compose:
      # `./gradlew :app:bootRun` starts these containers and stops them on exit.
      file: docker/docker-compose.yml

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.retailplatform: DEBUG

retail:
  security:
    # The local profile has no sign-in: every request runs as this user with these roles, so nothing needs Azure.
    local:
      user: local-developer
      roles:
        - MasterData.Editor
        - Store.Orderer
        - Buyer
        - Buyer.Approver
        - Accounting.Clerk
        - Accounting.Manager
        - Pricing.Analyst
