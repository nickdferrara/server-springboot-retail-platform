# Azure production environment. Environment-specific settings and secrets are supplied by the platform, never by this file.
management:
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    com.retailplatform: INFO

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
