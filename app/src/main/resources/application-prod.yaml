# Azure production environment. Environment-specific settings and secrets are supplied by the platform, never by this file.
management:
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: WARN
    com.retailplatform: INFO

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Microsoft Entra ID: tokens must come from this tenant and be issued for this API.
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
          audiences: ${ENTRA_API_AUDIENCE}
