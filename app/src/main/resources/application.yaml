spring:
  application:
    name: retail-platform
  profiles:
    # Environments set SPRING_PROFILES_ACTIVE to dev, test, or prod. A plain start on a workstation is local.
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    # Migrations run once per module; see ModuleMigrationConfiguration.
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        # The registry table is created by the platform module's Flyway migration.
        schema: platform
        schema-initialization:
          enabled: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

retail:
  company:
    # The time zone in which business dates, cutoffs, and fiscal periods are resolved.
    time-zone: ${COMPANY_TIME_ZONE:UTC}
  payables:
    # An open goods-received-not-invoiced accrual older than this many days is flagged as stale.
    stale-accrual-days: 60
    match:
      # An invoice line matches when its case cost is within this percentage of the purchase order's and its
      # total is within this amount of purchase order cost, in the invoice's currency.
      price-tolerance-percent: 2.00
      price-tolerance-amount: 10.00
